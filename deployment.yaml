---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watson-lua
  namespace: daocloud-test
  annotations:
spec:
  replicas: 1
  selector:
    matchLabels:
      app: watson-lua
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: watson-lua
    spec:
      containers:
        - name: watson-lua-container
          image: >-
            release-ci.daocloud.io/skoala/watson-lua:v1
          ports:
            - containerPort: 50051
              protocol: TCP
          args:
            - watson-auth-sso
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

---
apiVersion: v1
kind: Service
metadata:
  name: watson-lua
  namespace: daocloud-test
  annotations:
spec:
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051
  selector:
    app: watson-lua
  type: NodePort
  sessionAffinity: None
  externalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  internalTrafficPolicy: Cluster

---


